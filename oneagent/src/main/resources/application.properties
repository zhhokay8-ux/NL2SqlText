spring.application.name=oneagent

# ========== PostgreSQL 数据源 ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/nl2sql
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP 连接池
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# MyBatis-Plus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# pgvector 扩展由数据库侧手动执行：CREATE EXTENSION IF NOT EXISTS vector;
spring.sql.init.mode=never
