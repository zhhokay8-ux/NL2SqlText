# 与仓库根目录 docker-compose.yml 中的本地账号、端口一致。
spring:
  application:
    name: oneAgent
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    url: jdbc:postgresql://localhost:5433/nl2sql
    username: nl2sql
    password: nl2sql
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 0
      min-idle: 0
      max-active: 20
  elasticsearch:
    uris: http://localhost:9200
